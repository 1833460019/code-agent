[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcc-repo-agent"
version = "0.2.0"
description = "An LCC-inspired coding agent runtime with full and measurable baseline profiles"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.34.0",
  "python-dotenv>=1.0.1",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.10.0",
  "httpx>=0.27.0",
  "pre-commit>=4.3.0",
  "ruff>=0.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["backend/.venv", "frontend/node_modules", "tests/.work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["repo_agent", "backend/app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["repo_agent*"]

[tool.setuptools.package-data]
repo_agent = ["prompts/*.txt"]
