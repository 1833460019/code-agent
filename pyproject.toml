[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcc-repo-agent"
version = "0.2.0"
description = "An LCC-inspired coding agent runtime with full and measurable baseline profiles"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.34.0",
  "python-dotenv>=1.0.1",
  "jsonschema>=4.23.0",
]

[tool.setuptools.packages.find]
include = ["repo_agent*"]

[tool.setuptools.package-data]
repo_agent = ["prompts/*.txt"]
